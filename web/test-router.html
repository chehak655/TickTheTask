
<!DOCTYPE html>
<html>
<body>
<div id="root"></div>
<script type="module">
  import React from "https://esm.sh/react@18.2.0";
  import { createRoot } from "https://esm.sh/react-dom@18.2.0/client";
  import { BrowserRouter, useNavigate, Routes, Route } from "https://esm.sh/react-router-dom@6.22.3";

  function App() {
    const navigate = useNavigate();
    React.useEffect(() => {
      setTimeout(() => {
        navigate("/verify-email");
      }, 1000);
    }, []);
    return React.createElement("div", null, "Navigating...");
  }

  const root = createRoot(document.getElementById("root"));
  root.render(
    React.createElement(BrowserRouter, { basename: "/TickTheTask/" },
      React.createElement(Routes, null,
        React.createElement(Route, { path: "*", element: React.createElement(App) })
      )
    )
  );
</script>
</body>
</html>
