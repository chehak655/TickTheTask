version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tickthetask-postgres
    restart: always
    environment:
      POSTGRES_USER: tickthetask
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: tickthetask_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
