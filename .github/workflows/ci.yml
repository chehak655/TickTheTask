name: TickTheTask CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
          
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
        
      - name: Run Linter
        working-directory: ./web
        run: npm run lint
        
      - name: Build Web App
        working-directory: ./web
        run: npm run build
