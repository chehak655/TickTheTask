services:
  - type: web
    name: tickthetask-backend
    plan: free
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tickthetask-db
    plan: free
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://chehak655.github.io"]'
      - key: FRONTEND_URL
        value: https://chehak655.github.io/TickTheTask

databases:
  - name: tickthetask-db
    plan: free
    databaseName: tickthetask
    user: tickthetask
